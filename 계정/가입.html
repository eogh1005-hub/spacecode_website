<body class="account-gate">
  <main class="gate">
    <a class="gate-logo" href="../index.html">
      <img src="../로고/mark-black.png" alt="">
      <span>SPACE CODE</span>
    </a>
    <h1>회원가입</h1>
    <form class="account-form gate-form" data-account-form="signup">
      <label>
        <span class="gate-hidden">이름</span>
        <input name="name" type="text" autocomplete="name" maxlength="40" placeholder="이름">
      </label>
      <label>
        <span class="gate-hidden">이메일</span>
        <input name="email" type="email" autocomplete="email" placeholder="이메일 주소를 입력하세요" required>
      </label>
      <label>
        <span class="gate-hidden">비밀번호</span>
        <input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="비밀번호" required>
      </label>
      <p class="account-message" data-account-message></p>
      <button class="gate-continue" type="submit">회원가입</button>
    </form>
    <p class="gate-switch">이미 계정이 있으면 <a href="로그인.html">로그인</a></p>
    <p class="gate-note">계속 진행하면 <a href="/terms">이용약관</a>에 동의하고 <a href="/privacy">개인정보처리방침</a>을 읽은 것으로 간주됩니다.</p>
  </main>
  <script src="화면.js"></script>
</body>
</html>
