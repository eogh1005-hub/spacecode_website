<body class="account-gate">
  <main class="gate">
    <a class="gate-logo" href="../index.html">
      <img src="../로고/mark-black.png" alt="">
      <span>SPACE CODE</span>
    </a>
    <h1>로그인 또는 회원가입</h1>
    <a class="gate-naver account-naver" href="https://spacecode.co.kr/api/auth/naver/login">
      <span class="gate-n" aria-hidden="true">N</span>
      네이버로 계속하기
    </a>
    <a class="gate-kakao account-kakao" href="https://spacecode.co.kr/api/auth/kakao/login">
      <span class="gate-k" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2C6.3 2.2 1.7 6 1.7 10.7c0 3 2 5.6 5 7l-.5 3.4c0 .3.3.5.6.3l3.6-2.4c.5.1 1 .1 1.6.1 5.7 0 10.3-3.8 10.3-8.5S17.7 2.2 12 2.2z"/></svg></span>
      카카오로 계속하기
    </a>
    <p class="gate-or"><span>또는</span></p>
    <form class="account-form gate-form" data-account-form="login">
      <label>
        <span class="gate-hidden">이메일</span>
        <input name="email" type="email" autocomplete="email" placeholder="이메일 주소를 입력하세요" required>
      </label>
      <label>
        <span class="gate-hidden">비밀번호</span>
        <input name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
      </label>
      <p class="account-message" data-account-message></p>
      <button class="gate-continue" type="submit">계속</button>
    </form>
    <p class="gate-switch">계정이 없으면 <a href="가입.html">회원가입</a></p>
    <p class="gate-note">계속 진행하면 <a href="/terms">이용약관</a>에 동의하고 <a href="/privacy">개인정보처리방침</a>을 읽은 것으로 간주됩니다.</p>
  </main>
  <script src="../android/nav.js"></script>
  <script src="세션.js"></script>
  <script src="화면.js"></script>
</body>
</html>
