<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>현재 개선된 서비스를 준비중입니다 — Space Code</title>
  <link rel="icon" href="/로고/favicon.ico?v=5">
  <link rel="icon" type="image/png" sizes="48x48" href="/로고/favicon-48.png?v=5">
  <link rel="icon" type="image/png" sizes="32x32" href="/로고/favicon.png?v=5">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-width: 1280px;
      min-height: 100%;
      background: #000000;
      color: #f4f4f4;
      font-family: Pretendard, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header { padding: 28px 32px 0; }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
    }
    .logo-mark {
      height: 40px;
      width: auto;
      display: block;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .logo-name {
      font-family: Montserrat, sans-serif;
      font-weight: 800;
      font-size: 26px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #f2f2f2;
    }
    .logo-tag {
      color: #f2f2f2;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px 88px;
    }
    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.35;
      letter-spacing: -0.04em;
      font-weight: 800;
    }
    p {
      margin: 22px 0 0;
      max-width: 28em;
      color: #c8c8c8;
      font-size: 1rem;
      line-height: 1.75;
    }
    .home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding: 12px 22px;
      border: 1px solid #6a6a6a;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }
    .retry {
      width: 18px;
      height: 18px;
      flex: none;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">
      <img class="logo-mark" src="/로고/mark-white.png" alt="">
      <span class="logo-text">
        <span class="logo-name">SPACE CODE</span>
        <span class="logo-tag">Built to code, Built by code</span>
      </span>
    </a>
  </header>
  <main>
    <h1>현재 개선된 서비스를 준비중입니다.</h1>
    <p>더 나은 서비스를 위해 양해 부탁드립니다.</p>
    <a class="home" href="/">
      <svg class="retry" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.2-5.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 4v6h-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      재시도
    </a>
  </main>
</body>
</html>
